# Initial HTTP template. Configure your own HTTPS certificate before public login.
# Merge with your site's existing services instead of replacing their configuration.
server {
    listen 80;
    server_name example.com;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /art-studio { return 301 /art-studio/; }
    location ^~ /art-studio/api/ {
        proxy_pass http://127.0.0.1:18080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 60s;
        access_log off;
    }
    location = /art-studio/api { return 404; }
    location ~ (^|/)\. { return 404; }
    location /art-studio/assets/ {
        alias /opt/art-studio/web/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /art-studio/index.html {
        alias /opt/art-studio/web/index.html;
        add_header Cache-Control "no-cache";
    }
    location /art-studio/ {
        alias /opt/art-studio/web/;
        try_files $uri $uri/ /art-studio/index.html;
    }
    location / { return 404; }
}
